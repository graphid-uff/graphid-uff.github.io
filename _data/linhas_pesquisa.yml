- title: "Redução e Mitigação de Risco de Desastres"
  description: "Desenvolvimento, avaliação e implementação de estratégias e medidas estruturais e não estruturais para redução e mitigação do risco de desastres, com foco na prevenção, no planejamento e no aumento da resiliência das áreas vulneráveis."
