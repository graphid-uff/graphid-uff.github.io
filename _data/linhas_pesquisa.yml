- title: "Uso e Cobertura do Solo (LULC)"
  description: "Avaliação dos efeitos das mudanças de uso e cobertura do solo sobre a perda de solo, a infiltração, o escoamento superficial, a evapotranspiração e as vazões em bacias hidrográficas."
