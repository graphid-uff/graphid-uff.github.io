- title: "Hidrologia e Geomorfologia"
  description: "Estudo dos processos hidrológicos e geomorfológicos que moldam a paisagem e condicionam a ocorrência de eventos extremos, incluindo o monitoramento hidrossedimentológico, o fluxo de água no solo e a geração de escoamento em bacias hidrográficas, oferecendo a base física para a compreensão dos mecanismos deflagradores de desastres naturais."
  icon: "💧"
  importance: 0
