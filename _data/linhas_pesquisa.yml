- title: "Mudanças Climáticas"
  description: "Análise das tendências e do comportamento de eventos extremos de precipitação (intensidade, duração e frequência), das tendências de vazões, das condições de chuva associadas a deslizamentos e da evolução temporal dos desastres naturais."
