- title: "Conectividade Hidrossedimentológica"
  description: "Estudos de hidrogeomorfologia de encostas e canais, desenvolvimento e aplicação do Índice de Conectividade Hidrossedimentológica (IHC), zoneamento hidrossedimentológico e validação da conectividade da paisagem."
