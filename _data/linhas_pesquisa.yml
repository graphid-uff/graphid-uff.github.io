- title: "Modelagem Hidrológica e Geotécnica para Previsão de Deslizamentos Induzidos por Chuva"
  description: "Desenvolvimento e aplicação de modelos hidrológicos e geotécnicos para previsão de deslizamentos induzidos por eventos extremos de precipitação, integrando modelagem chuva-vazão, estabilidade de encostas, umidade do solo, geoprocessamento e calibração de modelos numéricos para avaliação de suscetibilidade e apoio à gestão de riscos."
